<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secret Blessing</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            background:
                radial-gradient(circle at top, #fff4a8, transparent 40%),
                linear-gradient(135deg, #0b2d5c, #164f91);

            color: white;
        }

        .card {
            width: 100%;
            max-width: 430px;
            padding: 35px 25px;
            text-align: center;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 28px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
            animation: float 2s infinite ease-in-out;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .instruction {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .numbers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .call-button {
            display: block;
            text-decoration: none;
            padding: 16px;

            border-radius: 50px;

            background: #f7d33c;
            color: #102d55;

            font-size: 18px;
            font-weight: bold;

            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.2);

            transition: 0.2s;
        }

        .call-button:hover {
            transform: scale(1.03);
        }

        .call-button:active {
            transform: scale(0.97);
        }

        .magic {
            margin-top: 25px;
            padding: 22px 15px;

            border-radius: 20px;

            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed #f7d33c;
        }

        .magic-title {
            font-size: 12px;
            letter-spacing: 3px;
            color: #f7d33c;
            margin-bottom: 12px;
        }

        .magic-word {
            font-size: 24px;
            font-weight: 900;
            color: white;
            line-height: 1.3;
        }

        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="icon">🎁</div>

        <h1>A Blessing Awaits</h1>

        <p class="subtitle">
            Congratulations! You have discovered a little surprise.
        </p>

        <div class="instruction">
            <strong>Here's what you have to do:</strong>
            <br><br>

            Call <strong>ANY ONE</strong> of the numbers below.
            <br>

            When someone answers, ask for your blessing.
        </div>

        <div class="numbers">

            <a class="call-button" href="tel:09541540876">
                09541540876
            </a>

            <a class="call-button" href="tel:09762736043">
                09762736043
            </a>

            <a class="call-button" href="tel:09278579513">
                09278579513
            </a>

        </div>

        <div class="magic">

            <div class="magic-title">
                THE MAGIC WORD
            </div>

            <div class="magic-word">
                "Taga STI kapo?"
            </div>

        </div>

        <div class="footer">
            GOOD LUCK &nbsp;✦&nbsp; HAVE FUN
        </div>

    </main>

</body>
  </html>
